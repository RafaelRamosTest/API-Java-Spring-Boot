global:
  scrape_interval: 5s # Coleta métricas a cada 5 segundos

scrape_configs:
  - job_name: 'demo-api'
    metrics_path: '/actuator/prometheus' # Endpoint exposto pelo Spring Boot Actuator
    static_configs:
      - targets: ['demo-api:8081'] # Nome do serviço da API no podman-compose + porta interna